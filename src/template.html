<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Raporu</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17233c;--muted:#64748b;--border:#e2e7f0;--accent:#4f46e5;--selected:#eeedff;--red:#dc354b;--green:#16865b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}body.dark{--bg:#111827;--card:#1e293b;--text:#e2e8f0;--muted:#a4b1c5;--border:#334155;--selected:#34325d}button,input,select{font:inherit;color:inherit}button,select,input{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}header{height:66px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 26px}header strong{font-size:19px}header time{margin-left:auto;color:var(--muted)}.shell{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 66px)}aside{border-right:1px solid var(--border);padding:18px 12px}aside button{display:block;width:100%;text-align:left;margin-bottom:8px;border:0;background:transparent}aside button.active{background:var(--selected);color:var(--accent)}main{padding:24px;min-width:0}h1{font-size:23px;margin:0 0 18px}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:18px 0 8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:9px}.card{padding:17px}.number{display:block;font-size:28px;font-weight:700;margin:7px 0}.muted,small{color:var(--muted)}.red{color:var(--red)}.green{color:var(--green)}.summary{margin:14px 0 20px}.bar{height:9px;border-radius:6px;background:var(--border);display:flex;overflow:hidden;margin-bottom:8px}.bar span{display:block}.workspace{display:grid;grid-template-columns:minmax(300px,40%) 1fr;gap:12px}.panel{padding:16px;min-width:0}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.filters input{width:100%;flex:1;min-width:140px}.group{margin-bottom:17px}.group-title{padding:8px 4px;font-weight:650}.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:6px;padding:13px}.row.selected{background:var(--selected);border-color:#c6c2ff}.row .duration{margin-left:auto}.badge{display:inline-block;padding:5px 8px;border-radius:6px;background:var(--selected);font-size:12px;margin:0 5px 5px 0}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin:14px 0}.tabs button{border:0;border-radius:0;background:transparent}.tabs .active{color:var(--accent);border-bottom:2px solid var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:14px;border:1px solid var(--border);border-radius:7px;font:12px/1.7 ui-monospace,monospace}.error{border-left:3px solid var(--red)}details{padding:9px 0;border-bottom:1px solid var(--border)}summary{cursor:pointer;display:list-item}.step-time{float:right;color:var(--muted)}.attachment{display:block;margin:12px 0;padding:12px;border:1px solid var(--border);border-radius:7px}.attachment img,.attachment video{display:block;max-width:100%;max-height:360px;margin-top:10px}.attachment a{color:var(--accent)}.notice{padding:12px;background:var(--selected);border-radius:7px;margin:12px 0}footer{color:var(--muted);font-size:12px;margin-top:18px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--border);padding:12px;text-align:left}.attempt{margin-top:10px}label{color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:1fr}aside{display:flex;border:0;overflow:auto;padding:8px}aside button{white-space:nowrap;margin:0}.workspace{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}header{padding:12px;height:auto;flex-wrap:wrap}main{padding:16px}} 
</style>
<header><strong id="brand">Test Raporu</strong><span class="badge" id="runstatus"></span><time id="date"></time><button id="theme" aria-label="Temayı değiştir">◐</button></header>
<div class="shell"><aside><button data-view="overview" class="active">▦ Genel Bakış</button><button data-view="tests">☷ Test Sonuçları</button><button data-view="speed">◷ Süre Analizi</button><button data-view="assets">▧ Ekler</button></aside><main><h1 id="heading">Çalıştırma özeti</h1><div id="stats"></div><div id="global"></div><div id="content"></div><footer>Rota Reporter · Yerel rapor · Senaryo sayısı projeler arasında gruplanır; çalıştırma sayısı proje ve tekrar indeksini içerir. Retry denemeleri ayrı gösterilir.</footer></main></div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sec=v=>(Number(v||0)/1000).toLocaleString('tr-TR',{maximumFractionDigits:2})+' sn';
const labels={expected:'Başarılı',unexpected:'Başarısız',flaky:'Retry ile geçti',skipped:'Atlandı',passed:'Geçti',failed:'Başarısız',timedOut:'Zaman aşımı',timedout:'Zaman aşımı',interrupted:'Kesildi',notRun:'Çalışmadı'};
const last=t=>t.attempts.at(-1);const state=t=>!t.attempts.length?'notRun':last(t).status==='interrupted'?'interrupted':t.outcome;const bad=t=>['unexpected','interrupted','notRun'].includes(state(t));
let selected=data.tests.find(bad)?.id||data.tests[0]?.id,attemptIndex=null,tab='steps',view='overview',query='',filter='',project='';
$('brand').textContent=data.title;document.title=data.title;$('date').textContent=new Date(data.startTime).toLocaleString('tr-TR');$('runstatus').textContent=labels[data.status]||data.status;
$('theme').onclick=()=>document.body.classList.toggle('dark');
function stats(){const groups=new Set(data.tests.map(t=>t.key));const counts={expected:0,unexpected:0,flaky:0,skipped:0,interrupted:0,notRun:0};data.tests.forEach(t=>counts[state(t)]++);$('stats').innerHTML='<div class="cards">'+[['Senaryo',groups.size],['Çalıştırma',data.tests.length],['Başarısız',counts.unexpected],['Toplam süre',sec(data.duration)]].map(([k,v])=>'<div class="card">'+k+'<span class="number '+(k==='Başarısız'?'red':'')+'">'+v+'</span></div>').join('')+'</div><div class="summary"><div class="bar">'+Object.entries(counts).map(([k,v])=>'<span style="width:'+(data.tests.length?v/data.tests.length*100:0)+'%;background:'+({expected:'var(--green)',unexpected:'var(--red)',flaky:'#d99a20'}[k]||'var(--muted)')+'"></span>').join('')+'</div><span class="muted">'+Object.entries(counts).map(([k,v])=>labels[k]+' '+v).join(' · ')+' · Toplam deneme '+data.tests.reduce((n,t)=>n+t.attempts.length,0)+'</span></div>';$('global').innerHTML=data.globalErrors.map(e=>'<pre class="error">'+esc(e.message)+'</pre>').join('')+data.warnings.map(w=>'<div class="notice">'+esc(w)+'</div>').join('');}
function filters(){return '<div class="filters"><input id="search" aria-label="Senaryo ara" placeholder="Senaryo ara…" value="'+esc(query)+'"><select id="status" aria-label="Sonuç filtresi"><option value="">Tüm sonuçlar</option>'+['expected','unexpected','flaky','skipped','interrupted','notRun'].map(s=>'<option value="'+s+'" '+(filter===s?'selected':'')+'>'+labels[s]+'</option>').join('')+'</select><select id="project" aria-label="Proje filtresi"><option value="">Tüm projeler</option>'+[...new Set(data.tests.map(t=>t.project))].map(p=>'<option '+(p===project?'selected':'')+' value="'+esc(p)+'">'+esc(p)+'</option>').join('')+'</select></div>';}
function matches(t){return (!query||(t.title+' '+t.file+' '+t.tags.join(' ')).toLocaleLowerCase('tr').includes(query.toLocaleLowerCase('tr')))&&(!filter||state(t)===filter)&&(!project||t.project===project);}
function steps(items){return items.map(s=>'<details '+(s.error?'open':'')+'><summary><span class="'+(s.error?'red':'')+'">'+(s.error?'✕ ':'')+esc(s.title)+'</span><span class="step-time">'+sec(s.duration)+'</span></summary>'+(s.error?'<pre class="error">'+esc(s.error.message)+'</pre>':'')+steps(s.steps)+'</details>').join('');}
function attachments(items){return items.length?items.map(a=>'<div class="attachment"><strong>'+esc(a.name)+'</strong>'+(a.missing?'<p class="muted">Dosya bulunamadı.</p>':' <a href="'+esc(a.url)+'" download>İndir</a>'+(/^image\/(png|jpeg|gif|webp)$/.test(a.contentType)?'<img alt="'+esc(a.name)+'" src="'+esc(a.url)+'">':/^video\//.test(a.contentType)?'<video controls src="'+esc(a.url)+'"></video>':'')+(a.name==='trace'?'<p class="muted">İndirdikten sonra: npx playwright show-trace dosya.zip</p>':''))+'</div>').join(''):'<p class="muted">Bu denemeye ait ek yok.</p>';}
function detail(){const t=data.tests.find(t=>t.id===selected);if(!t)return '<p class="muted">Bir test seçin.</p>';const index=attemptIndex??t.attempts.length-1;const r=t.attempts[index];return '<h2>'+esc(t.title)+'</h2><span class="badge">'+esc(t.project)+'</span><span class="badge '+(bad(t)?'red':'')+'">'+labels[state(t)]+'</span><p class="muted">'+esc(t.file)+':'+t.line+' · '+(r?sec(r.duration):'Çalıştırılmadı')+'</p>'+t.tags.map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+(t.expectedStatus==='failed'?'<div class="notice">Bu testte başarısızlık bekleniyor (test.fail).</div>':'')+'<label>Deneme <select id="attempt">'+t.attempts.map((a,i)=>'<option value="'+i+'" '+(index===i?'selected':'')+'>'+(i+1)+'. deneme · '+(labels[a.status]||a.status)+'</option>').join('')+'</select></label><div class="tabs">'+[['steps','Adımlar'],['errors','Hata Detayı'],['assets','Ekler'],['logs','Loglar']].map(([k,n])=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+n+'</button>').join('')+'</div>'+(!r?'<p>Bu test çalıştırılmadı.</p>':tab==='steps'?steps(r.steps)||'<p class="muted">Adım kaydı yok.</p>':tab==='errors'?r.errors.map(e=>'<pre class="error">'+esc(e.message)+'\n'+esc(e.snippet)+'\n'+esc(e.stack)+'</pre>').join('')||'<p class="muted">Hata kaydı yok.</p>':tab==='assets'?attachments(r.attachments):'<h3>stdout</h3><pre>'+esc(r.stdout||'Log yok.')+'</pre><h3>stderr</h3><pre>'+esc(r.stderr||'Log yok.')+'</pre>');}
function list(){const visible=data.tests.filter(matches);const groups=new Map;visible.forEach(t=>{if(!groups.has(t.key))groups.set(t.key,[]);groups.get(t.key).push(t);});return [...groups.values()].map(ts=>'<div class="group"><div class="group-title">'+esc(ts[0].title)+'<br><small>'+esc(ts[0].file)+':'+ts[0].line+'</small></div>'+ts.map(t=>'<button class="row '+(selected===t.id?'selected':'')+'" data-id="'+esc(t.id)+'"><span class="'+(bad(t)?'red':'green')+'">'+(bad(t)?'✕':'•')+'</span><span>'+esc(t.project)+'<br><small>'+labels[state(t)]+'</small></span><span class="duration">'+sec(last(t)?.duration)+'</span></button>').join('')+'</div>').join('')||'<p class="muted">Eşleşen test yok.</p>';}
function render(){stats();$('heading').textContent={overview:'Çalıştırma özeti',tests:'Test sonuçları',speed:'Süre analizi',assets:'Ekler'}[view];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='speed'){$('content').innerHTML='<div class="panel"><p class="muted">Son deneme süreleri; paralel çalışma nedeniyle toplamları çalıştırmanın duvar saati süresine eşit olmayabilir.</p><table><thead><tr><th>Senaryo</th><th>Proje</th><th>Süre</th></tr></thead><tbody>'+[...data.tests].sort((a,b)=>(last(b)?.duration||0)-(last(a)?.duration||0)).map(t=>'<tr><td><button data-id="'+esc(t.id)+'">'+esc(t.title)+'</button></td><td>'+esc(t.project)+'</td><td>'+sec(last(t)?.duration)+'</td></tr>').join('')+'</tbody></table></div>';}else if(view==='assets'){$('content').innerHTML='<div class="panel">'+data.tests.map(t=>t.attempts.map((r,i)=>r.attachments.length?'<h2>'+esc(t.title)+' · '+esc(t.project)+' · Deneme '+(i+1)+'</h2>'+attachments(r.attachments):'').join('')).join('')+'<p class="muted">Yalnızca kaydedilmiş ekler listelenir.</p></div>';}else{$('content').innerHTML='<div class="workspace"><section class="panel">'+filters()+'<div id="testlist">'+list()+'</div></section><section class="panel" id="detail">'+detail()+'</section></div>'; $('search').oninput=e=>{query=e.target.value;$('testlist').innerHTML=list();};$('status').onchange=e=>{filter=e.target.value;render();};$('project').onchange=e=>{project=e.target.value;render();};}const a=$('attempt');if(a)a.onchange=e=>{attemptIndex=Number(e.target.value);render();};}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();}if(b.dataset.id){selected=b.dataset.id;attemptIndex=null;view='tests';render();}if(b.dataset.tab){tab=b.dataset.tab;render();}};render();
</script></html>
